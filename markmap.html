<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%274%27 fill=%27%232f6f6a%27/%3E%3C/svg%3E">
<title>Markmap map</title>
<link rel="stylesheet" href="common.css?v=202610270027">
<style>
  #mm { position: absolute; inset: 56px 0 0 0; width: 100%; height: calc(100% - 56px); display: block; overflow: visible; transform-origin: 0 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .map { touch-action: none; }
  .map { overflow: hidden; }
  .markmap-foreign { color: var(--ink); }
  .markmap-foreign div { color: var(--ink); }
  .markmap-node circle { --markmap-circle-open-bg: var(--panel); }
  .markmap-foreign span.sub { font-weight: 600; }
  .markmap-foreign small { color: var(--muted); font-size: 0.8em; display: block; }
  .markmap-foreign span[data-id] { cursor: pointer; }
  .markmap-foreign span[data-id]:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="layout">
  <main class="map">
    <div class="tools"><button id="full" class="tool" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg></button><button id="fit" class="tool" aria-label="Recenter the map" title="Recenter the map"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v3M8 11v3M2 8h3M11 8h3M8 6.2a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z"/></svg></button><button id="all" hidden>Expand all</button><button id="reset" hidden>Collapse</button></div>
    <svg id="mm"></svg>
  </main>
  <aside class="chat"></aside>
</div>
<script src="data.js?v=202610270027"></script>
<script src="common.js?v=202610270027"></script>
<script src="vendor/d3-7.9.0.min.js"></script>
<script src="vendor/markmap-lib.js"></script>
<script src="vendor/markmap-view.js"></script>
<script>
  MapPage.header("Markmap");
  const t = MapPage.topic();
  const byId = new Map();
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // One colour per subtopic: its line, its name and everything under it share it, so a branch reads as one family.
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const BRANCH = dark
    ? ["#7cc4bb", "#f0a060", "#86a8f0", "#d29be0", "#7fcf86", "#f08a9e", "#d6c25a", "#a9b6c4"]
    : ["#2f6f6a", "#b5541c", "#3d63b8", "#8a3f8f", "#2e7d32", "#a33a4f", "#7a6a12", "#4a5a6a"];
  const ROOT = dark ? "#8a9097" : "#9a958b";
  function toMarkmap(n, depth, branch) {
    byId.set(String(n.id), n);
    const colour = depth === 0 ? ROOT : BRANCH[branch % BRANCH.length];
    let html = depth === 1
      ? `<span data-id="${n.id}" class="sub" style="color:${colour}">${esc(n.name)}</span>`
      : `<span data-id="${n.id}">${esc(n.name)}</span>`;
    if (n.line) html += `<small>${esc(n.line)}</small>`;
    return {
      content: html,
      children: n.children.map((c, i) => toMarkmap(c, depth + 1, depth === 0 ? i : branch)),
      payload: { fold: depth >= 2 && n.children.length ? 1 : 0, colour },
    };
  }
  let mm;
  let renderVersion = 0;
  async function render() {
    const version = ++renderVersion;
    if (mm) mm.destroy();
    document.getElementById("mm").innerHTML = "";
    const root = toMarkmap(t, 0, 0);
    mm = markmap.Markmap.create("#mm", { color: (node) => node.payload?.colour || ROOT, maxWidth: 280, spacingHorizontal: 40, spacingVertical: 10, duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 250, fitRatio: 0.95, maxInitialScale: 1 });
    // Phones redraw every label on each frame of a drag. Listen for gestures on the (unmoving) map area and,
    // during a gesture, move the drawing as one layer; apply the real transform once when the gesture ends.
    const area = surface.parentNode, base = mm.zoom.filter();
    mm.svg.on(".zoom", null);
    mm.zoom.filter((e) => !(e.target.closest && e.target.closest(".tools")) && base(e));
    d3.select(area).call(mm.zoom).on("dblclick.zoom", null);
    let start = null;
    mm.zoom
      .on("start.fast", (e) => { if (e.sourceEvent) start = d3.zoomTransform(area); })
      .on("zoom", (e) => {
        const t = e.transform;
        if (start && e.sourceEvent) {
          const s = t.k / start.k;
          surface.style.transform = `translate(${t.x - s * start.x}px, ${t.y - s * start.y}px) scale(${s})`;
        } else { mm.g.attr("transform", t); area.__zoom = t; }
      })
      .on("end.fast", (e) => {
        if (!start) return;
        start = null;
        surface.style.transform = "";
        mm.g.attr("transform", e.transform);
        mm.svg.node().__zoom = e.transform;
      });
    await mm.setData(root);
    if (version === renderVersion) await mm.fit();
  }
  const surface = document.getElementById("mm");
  function controls() {
    surface.querySelectorAll("[data-id]").forEach((el) => MapPage.accessible(el, byId.get(el.dataset.id).name));
    surface.querySelectorAll("g.markmap-node > circle").forEach((el) => {
      const data = el.__data__;
      MapPage.accessible(el, "Fold or unfold " + el.parentNode.querySelector("[data-id]").textContent);
      el.setAttribute("aria-expanded", String(!data.payload.fold));
    });
  }
  new MutationObserver(controls).observe(surface, { childList: true, subtree: true });
  surface.addEventListener("click", () => requestAnimationFrame(controls));
  render();
  document.fonts.ready.then(() => { if (mm) mm.fit(); });
  new ResizeObserver(() => { if (mm) mm.fit(); }).observe(surface);
  document.getElementById("mm").addEventListener("click", (e) => {
    const el = e.target.closest("[data-id]");
    if (el) MapPage.ask(byId.get(el.dataset.id));
  });
  MapPage.zoomControls(() => mm.svg.call(mm.zoom.scaleBy, 1.25), () => mm.svg.call(mm.zoom.scaleBy, .8));
  document.getElementById("fit").onclick = () => mm.fit();
  document.getElementById("reset").onclick = render;
  document.getElementById("all").onclick = async () => {
    (function walk(n) { n.payload = { ...n.payload, fold: 0 }; (n.children || []).forEach(walk); })(mm.state.data);
    await mm.renderData();
    await mm.fit();
  };
  MapPage.fullScreen();
</script>
</body>
</html>
